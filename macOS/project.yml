name: WeatherStationMac
options:
  bundleIdPrefix: com.henryswisvip
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  WeatherShared:
    type: framework
    platform: macOS
    sources:
      - path: Shared/Sources
    info:
      path: Shared/Info.plist
      properties:
        CFBundleDisplayName: WeatherShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henryswisvip.weatherstation.shared
        SKIP_INSTALL: YES

  WeatherStationMac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SWIS Weather
        LSApplicationCategoryType: public.app-category.weather
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    dependencies:
      - target: WeatherShared
      - target: WeatherWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henryswisvip.weatherstation.mac

  WeatherWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget/Sources
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: WeatherShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henryswisvip.weatherstation.mac.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
