<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.css">
    <title>SWIS Weather Station</title>
</head>
<body class="is-loading">
    <div class="atmo" aria-hidden="true">
        <div class="sky-glow"></div>
    </div>
    <main class="container">
        <header class="top-bar">
            <div class="title-wrap">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <h1>SWIS Weather Station</h1>
                    <p class="subtitle">Developed by Henry Wong, a 2024 SWIS Alumni, as my CS IA</p>
                </div>
            </div>
            <a class="language-switcher" href="index_cn.html" aria-label="Switch language">
                <i class="fa-regular fa-language"></i>
            </a>
        </header>

        <section class="hero">
            <div class="hero-orb" aria-hidden="true"></div>
            <img class="weather-icon" src="" alt="Current weather icon">
            <p class="temperature">--<span>°C</span></p>
            <p class="description">Feels like --°C</p>
            <p class="status-pill" id="weatherStatus">Loading latest data...</p>
            <p class="updated-at" id="lastUpdated">Last updated: --</p>
        </section>

        <section class="metrics-grid">
            <article class="metric-card">
                <i class="fa-solid fa-water"></i>
                <p class="label">Humidity</p>
                <p class="value" id="humidityValue">--</p>
            </article>
            <article class="metric-card">
                <i class="fa-solid fa-wind"></i>
                <p class="label">Wind Speed</p>
                <p class="value" id="windSpeedValue">--</p>
            </article>
            <article class="metric-card">
                <i class="fa-solid fa-gauge-high"></i>
                <p class="label">Wind Gust</p>
                <p class="value" id="windGustValue">--</p>
            </article>
            <article class="metric-card">
                <i class="fa-solid fa-sun-plant-wilt"></i>
                <p class="label">UV Index</p>
                <p class="value" id="uvValue">--</p>
            </article>
            <article class="metric-card">
                <i class="fa-regular fa-compass"></i>
                <p class="label">Wind Direction</p>
                <p class="value" id="windDirectionValue">--</p>
            </article>
            <article class="metric-card">
                <i class="fa-regular fa-cloud-rain"></i>
                <p class="label">Rain Rate</p>
                <p class="value" id="rainRateValue">--</p>
            </article>
            <article class="metric-card metric-wide">
                <i class="fa-solid fa-temperature-three-quarters"></i>
                <p class="label">Feels Like</p>
                <p class="value" id="feelsLikeValue">--</p>
            </article>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
